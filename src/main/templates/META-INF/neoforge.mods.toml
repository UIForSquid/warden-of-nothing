modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Where players report problems; shown on the crash screen and in the mod list.
issueTrackerURL="https://github.com/UIForSquid/warden-of-nothing/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# The mod's home page, linked from the mod list.
displayURL="https://github.com/UIForSquid/warden-of-nothing"
authors="${mod_authors}"
description='''
Turns the Warden into a boss that belongs to its Ancient City.
'''

# Mixins are used only where no NeoForge event covers the needed behaviour.
[[mixins]]
config="${mod_id}.mixins.json"

# Access transformer for package-private / protected vanilla members the mod needs to read or call.
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
